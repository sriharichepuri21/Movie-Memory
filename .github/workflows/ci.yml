name: Verify Movie Memory
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movie_memory
          POSTGRES_PASSWORD: movie_memory
          POSTGRES_DB: movie_memory_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U movie_memory -d movie_memory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://movie_memory:movie_memory@127.0.0.1:5432/movie_memory_test?schema=public
      TEST_DATABASE_URL: postgresql://movie_memory:movie_memory@127.0.0.1:5432/movie_memory_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
