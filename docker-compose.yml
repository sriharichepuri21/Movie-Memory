services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: movie_memory
      POSTGRES_USER: movie_memory
      POSTGRES_PASSWORD: movie_memory
    volumes:
      - movie_memory_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/02-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_memory -d movie_memory"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  movie_memory_data:
